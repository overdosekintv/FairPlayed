name: Build FairPlayed (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project FairPlayed/FairPlayed.xcodeproj \
            -target FairPlayed \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="FairPlayed/build/Release-iphoneos/FairPlayed.app"
          test -d "$APP_PATH"
          rm -rf Payload FairPlayed-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry FairPlayed-unsigned.ipa Payload
          ls -la FairPlayed-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairPlayed-unsigned-ipa
          path: FairPlayed-unsigned.ipa
